<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Stok Buku - StoryVerse</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="brand"><i class="fas fa-book-open"></i> StoryVerse</div>
            <ul class="nav-menu">
                <li><a href="dashboard.html" class="active"><i class="fas fa-home"></i> Dashboard</a></li>
                <li><a href="stok.html"><i class="fas fa-box-open"></i> Stok & Katalog</a></li>
                <li><a href="pesanan.html"><i class="fas fa-clipboard-list"></i> History Pesanan</a></li> <!-- Ini Menu Barunya -->
                <li><a href="checkout.html" target="_blank"><i class="fas fa-shopping-cart"></i> Kasir / Checkout</a></li>
                <li><a href="tracking.html" target="_blank"><i class="fas fa-truck"></i> Tracking</a></li>
            </ul>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="header-top animate-fade-in">
                <div><h2 class="text-purple">Katalog Buku 📚</h2></div>
                <button class="btn btn-primary" onclick="openModal()"><i class="fas fa-plus"></i> Tambah Buku</button>
            </div>

            <!-- Area Render Buku -->
            <div class="book-grid animate-fade-in" id="bookContainer">
                <!-- Data di-render lewat JS -->
            </div>
        </main>
    </div>

    <!-- Modal Tambah/Edit -->
    <div class="modal-overlay" id="bookModal">
        <div class="modal-content">
            <h3 class="mb-2 text-purple" id="modalTitle">Tambah Buku Baru</h3>
            <form id="formBook">
                <input type="hidden" id="bookId">
                <div class="input-group">
                    <label>Judul Buku</label>
                    <input type="text" id="bJudul" class="form-control" required>
                </div>
                <div class="flex gap-1">
                    <div class="input-group" style="flex:1;"><label>Penulis</label><input type="text" id="bPenulis" class="form-control" required></div>
                    <div class="input-group" style="flex:1;"><label>Kategori</label><input type="text" id="bKategori" class="form-control" required></div>
                </div>
                <div class="flex gap-1">
                    <div class="input-group" style="flex:1;"><label>Harga (Rp)</label><input type="number" id="bHarga" class="form-control" required></div>
                    <div class="input-group" style="flex:1;"><label>Stok</label><input type="number" id="bStok" class="form-control" required></div>
                </div>
                <div class="flex justify-between mt-2">
                    <button type="button" class="btn" style="background:#eee; color:#333;" onclick="closeModal()">Batal</button>
                    <button type="submit" class="btn btn-coral">Simpan Buku</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/stok.js"></script>
</body>
</html>
