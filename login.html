<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - StoryVerse</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="login-container">
        <div class="login-left">
            <h1 style="font-size: 3rem; margin-bottom: 20px; z-index: 1;">StoryVerse</h1>
            <p style="font-size: 1.2rem; z-index: 1; opacity: 0.9;">Discover Your Next Favorite Story</p>
            <img src="https://cdni.iconscout.com/illustration/premium/thumb/online-library-4867919-4054044.png" alt="Books Illustration" style="margin-top: 50px;">
        </div>
        <div class="login-right">
            <div class="login-box animate-fade-in">
                <h2 class="mb-1 text-purple">Welcome Back! ✨</h2>
                <p class="mb-3 text-light">Masukan kredensial Anda untuk mengelola toko.</p>
                
                <form id="loginForm">
                    <div class="input-group">
                        <label>Username</label>
                        <input type="text" id="username" class="form-control" placeholder="Masukkan username..." required>
                    </div>
                    <div class="input-group">
                        <label>Password</label>
                        <input type="password" id="password" class="form-control" placeholder="Masukkan password..." required>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">
                        Login <i class="fas fa-arrow-right"></i>
                    </button>
                </form>
                
                <div style="text-align: center; margin-top: 20px;">
                    <a href="#" class="text-coral fw-600" style="font-size: 0.9rem;">Lupa Password?</a>
                </div>
            </div>
        </div>
    </div>
    <script src="js/data.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
