<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Track Order - StoryVerse</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .tracking-header { text-align: center; padding: 60px 20px; background: linear-gradient(135deg, var(--deep-purple), var(--coral)); color: white; border-radius: 0 0 30px 30px; }
        .search-box { display: flex; max-width: 500px; margin: 30px auto 0; background: white; padding: 10px; border-radius: var(--radius-pill); box-shadow: var(--shadow-hover); }
        .search-box input { flex: 1; border: none; outline: none; padding: 10px 20px; font-size: 1rem; border-radius: var(--radius-pill); }
    </style>
</head>
<body>
    <div class="tracking-header animate-fade-in">
        <h1 style="font-size: 2.5rem; margin-bottom:10px;">Lacak Pesanan Anda 🚚</h1>
        <p>Masukkan nomor Resi / Delivery Order untuk melihat status pengiriman.</p>
        <div class="search-box">
            <input type="text" id="resiInput" placeholder="Contoh: SV-123456">
            <button class="btn btn-primary" onclick="trackOrder()">Lacak</button>
        </div>
    </div>

    <div class="timeline" id="trackingResult" style="display: none; padding: 0 20px;">
        <!-- Hasil akan di render via JS -->
    </div>

    <script src="js/data.js"></script>
    <script src="js/tracking.js"></script>
</body>
</html>
